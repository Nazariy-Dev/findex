services:
  - type: web
    name: findex
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./scripts/render_build.sh
    startCommand: .venv/bin/uvicorn findex.web:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: INDEX_PATH
        value: deploy/index.bin
